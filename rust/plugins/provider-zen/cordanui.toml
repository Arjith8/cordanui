[plugin]
name = "provider-zen"
version = "0.1.0"
description = "OpenCode Zen provider — access GPT, Claude, Gemini, Qwen, and more via the Zen gateway"

[capabilities]
provider = true

[provider]
models = [
    "gpt-5.4",
    "gpt-5.4-mini",
    "claude-sonnet-4-5",
    "claude-haiku-4-5",
    "gemini-3.7-flash",
    "qwen-3-coder-480b",
    "deepseek-v4-pro",
    "grok-code",
    "kimi-k2",
]
api_key_env = "OPENCODE_API_KEY"

[build]
cmd = "cargo build --release"
bin = "target/release/provider-zen"
