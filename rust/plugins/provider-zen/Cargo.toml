[package]
name = "provider-zen"
version = "0.1.0"
edition = "2021"
license = "MIT"

# This is a standalone plugin binary, not part of the core workspace.
# The empty [workspace] table makes Cargo treat this as its own workspace
# root so it can be built independently.
[workspace]

[[bin]]
name = "provider-zen"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
