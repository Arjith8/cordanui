# cordanui-agents — the agent backend (plugin manifest).
#
# This is NOT a regular provider plugin. It is the agent backend binary
# that reads queued goals from Turso, runs provider plugins, and writes
# results back. It ships as a plugin so the TUI can discover, build, and
# optionally supervise it via [service].
#
# Build: `cargo build --release -p cordanui-agents` produces
# `target/release/cordanui-agents`.

[plugin]
name = "cordanui-agents"
version = "0.1.0"
description = "Agent backend — reads queued goals from Turso, runs provider plugins, writes results"

[capabilities]
# The backend is not a provider itself; it orchestrates provider plugins.
# agent = true signals it can process agent-mode goals.
agent = true

[build]
cmd = "cargo build --release -p cordanui-agents"
bin = "target/release/cordanui-agents"

[service]
# Run the backend as a long-running HTTP server (wake mode).
# The TUI / mobile POST to {addr}/wake to trigger task processing.
cmd = "./target/release/cordanui-agents"
args = ["--serve", "--port", "8081"]
addr = "http://127.0.0.1:8081"
health = "http://127.0.0.1:8081/health"
autostart = false
